<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BG-BOT v5 -- Login</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080d;--bg2:#0c1018;--bg3:#111822;--b1:#1a2536;--acc:#00d4aa;--ad:rgba(0,212,170,.12);--red:#ff4757;--t1:#e8edf5;--t2:#7a8ba8;--t3:#4a5568;--fm:'JetBrains Mono',monospace;--fs:'Inter',system-ui,sans-serif;--r:10px;--rl:14px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t1);font-family:var(--fs);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 30% 20%,rgba(0,212,170,.06),transparent 60%),radial-gradient(ellipse 60% 50% at 70% 80%,rgba(59,130,246,.04),transparent 50%);pointer-events:none}
.scan{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--acc),transparent);opacity:.15;animation:sc 6s ease-in-out infinite}
@keyframes sc{0%,100%{top:0}50%{top:100vh}}
.login-wrap{position:relative;z-index:1;width:100%;max-width:420px;padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--b1);border-radius:var(--rl);padding:40px 32px;position:relative;overflow:hidden}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),#3b82f6,#a855f7)}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-family:var(--fm);font-size:36px;font-weight:800;color:var(--acc);letter-spacing:-2px;margin-bottom:4px}
.logo p{font-size:13px;color:var(--t3);letter-spacing:3px;text-transform:uppercase}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 20px;background:#fff;color:#333;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--fs)}
.google-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(255,255,255,.1)}
.google-btn svg{width:20px;height:20px}
.divider{display:flex;align-items:center;gap:16px;margin:24px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--b1)}
.divider span{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:2px}
.email-form{display:flex;flex-direction:column;gap:12px}
.input{width:100%;padding:12px 16px;background:var(--bg3);border:1px solid var(--b1);border-radius:var(--r);color:var(--t1);font-size:14px;font-family:var(--fs);outline:none;transition:all .2s}
.input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--ad)}
.input::placeholder{color:var(--t3)}
.submit-btn{width:100%;padding:14px;background:var(--acc);color:var(--bg);border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:var(--fs)}
.submit-btn:hover{box-shadow:0 0 20px rgba(0,212,170,.3);transform:translateY(-1px)}
.error{background:rgba(255,71,87,.1);border:1px solid rgba(255,71,87,.2);color:var(--red);padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:16px;text-align:center}
.footer{text-align:center;margin-top:24px;font-size:11px;color:var(--t3);line-height:1.6}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.animate{animation:fadeUp .6s ease forwards}.animate-delay{animation-delay:.15s;opacity:0}
</style>
</head>
<body>
<div class="scan"></div>
<div class="login-wrap">
  <div class="login-card animate">
    <div class="logo animate-delay"><h1>BG-BOT</h1><p>Trading Engine v5</p></div>
    {% if request.args.get('error') %}
    <div class="error">{{ request.args.get('error') }}</div>
    {% endif %}
    {% if has_google %}
    <a href="/auth/google" style="text-decoration:none">
      <button class="google-btn animate-delay" type="button">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Sign in with Google
      </button>
    </a>
    {% endif %}
    <div class="divider animate-delay"><span>or</span></div>
    <form class="email-form animate-delay" action="/auth/email" method="POST">
      <input class="input" type="email" name="email" placeholder="Enter your email" required autofocus>
      <button class="submit-btn" type="submit">Continue with Email</button>
    </form>
    <div class="footer animate-delay">
      <p>By continuing, you agree to our Terms of Service.</p>
      <p style="margin-top:8px">Dual Timeframe Bot -- M1 Entry + M5 Trend</p>
    </div>
  </div>
</div>
</body>
</html>
